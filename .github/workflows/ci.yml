name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI only reads the code, so it doesn't need write access to anything.
permissions:
  contents: read

# A newer push to the same branch or PR makes the older run pointless, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the Node version from .nvmrc, so CI and local dev always match.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run build
      - run: npm test
